name: Android Build

on:
  push:
    branches:
      - main
      - list
      - new1
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        # The project pins toolchainVersion=25 and disables toolchain
        # auto-download (org.gradle.java.installations.auto-download=false),
        # so the runner must provide a matching JDK.
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Grant execute permission for gradlew
        run: chmod +x Android/gradlew

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.5'

      - name: Install Android NDK
        # gomobile bind cross-compiles the Go tunnel to a shared library,
        # which requires the NDK toolchain.
        run: |
          sdkmanager --install "ndk;27.2.12479018" --channel=0

      - name: Build tunnel AAR
        # Regenerates Android/app/libs/tunnel.aar from the Go sources so DNS
        # allowlist fixes in the tunnel engine actually reach the APK.
        # The prebuilt AAR committed in the repo is never rebuilt otherwise.
        working-directory: Android/tunnel
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.12
          gomobile init
          gomobile bind -target=android/arm64 -androidapi=24 -o ../app/libs/tunnel.aar .

      - name: Generate CI release signing keystore
        # Release builds require a keystore (see build.gradle.kts signing config,
        # which reads DITING_KEYSTORE_* env vars). Generate a throwaway CI key so
        # the release APK is installable; replace with your own key for releases.
        run: |
          keytool -genkeypair -v \
            -keystore "$HOME/diting-release.jks" \
            -alias diting-release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass diting123 -keypass diting123 \
            -dname "CN=DITING CI,O=DITING,C=CN"
          echo "DITING_KEYSTORE_FILE=$HOME/diting-release.jks" >> "$GITHUB_ENV"
          echo "DITING_KEYSTORE_PASSWORD=diting123" >> "$GITHUB_ENV"
          echo "DITING_KEY_ALIAS=diting-release" >> "$GITHUB_ENV"
          echo "DITING_KEY_PASSWORD=diting123" >> "$GITHUB_ENV"

      - name: Build debug APK
        working-directory: Android
        run: ./gradlew --no-daemon assembleDebug

      - name: Build release APK (R8 minified)
        working-directory: Android
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DITING-debug-apk
          path: Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DITING-release-apk
          path: Android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
