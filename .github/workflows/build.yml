name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "构建类型"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK + NDK
        run: |
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}" >> $GITHUB_ENV
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973" || true
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Set up Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build tunnel.aar with gomobile
        run: |
          set -e
          cd tunnel
          export PATH="$HOME/go/bin:$PATH"
          export CGO_ENABLED=1

          echo "=== Go version ==="
          go version

          echo "=== Install gomobile ==="
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.12

          echo "=== gomobile init ==="
          gomobile init

          echo "=== Verify package exports ==="
          go doc . Engine | head -20

          echo "=== gomobile bind ==="
          gomobile bind -v -target=android/arm64 -androidapi 29 \
            -o ../app/libs/tunnel.aar \
            .

          echo "=== Result ==="
          ls -lh ../app/libs/tunnel.aar

      - name: Use official Gradle distribution
        run: |
          sed -i 's|https\\://mirrors.cloud.tencent.com/gradle/gradle-9.4.1-bin.zip|https\\://services.gradle.org/distributions/gradle-9.4.1-bin.zip|' gradle/wrapper/gradle-wrapper.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'release' }}"
          if [ "$BUILD_TYPE" = "release" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DITING-${{ github.event.inputs.build_type || 'release' }}-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
