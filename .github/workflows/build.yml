name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "构建类型"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Use official Gradle distribution
        run: |
          sed -i 's|https\\://mirrors.cloud.tencent.com/gradle/gradle-9.4.1-bin.zip|https\\://services.gradle.org/distributions/gradle-9.4.1-bin.zip|' gradle/wrapper/gradle-wrapper.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'release' }}"
          if [ "$BUILD_TYPE" = "release" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DITING-${{ github.event.inputs.build_type || 'release' }}-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
