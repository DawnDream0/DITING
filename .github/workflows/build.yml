name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "构建类型"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}" >> $GITHUB_ENV
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"


      - name: Set up Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build tunnel.aar with gomobile
        run: |
          set -e
          cd tunnel
          export PATH="$HOME/go/bin:$PATH"
          export CGO_ENABLED=1

          # 找到 runner 上已有的 NDK
          NDK_PATH=$(ls -d $ANDROID_SDK_ROOT/ndk/*/ 2>/dev/null | head -1)
          if [ -z "$NDK_PATH" ]; then
            echo "Installing NDK..."
            sdkmanager "ndk;26.3.11579264"
            NDK_PATH="$ANDROID_SDK_ROOT/ndk/26.3.11579264/"
          fi
          export ANDROID_NDK_HOME=${NDK_PATH%/}
          echo "Using NDK: $ANDROID_NDK_HOME"
          ls $ANDROID_NDK_HOME/meta/platforms.json

          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.12
          gomobile init
          gomobile bind -v -target=android/arm64 -androidapi 29 \
            -o ../app/libs/tunnel.aar .
          ls -lh ../app/libs/tunnel.aar


      - name: Use official Gradle distribution
        run: |
          sed -i 's|https\\://mirrors.cloud.tencent.com/gradle/gradle-9.4.1-bin.zip|https\\://services.gradle.org/distributions/gradle-9.4.1-bin.zip|' gradle/wrapper/gradle-wrapper.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'release' }}"
          if [ "$BUILD_TYPE" = "release" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DITING-${{ github.event.inputs.build_type || 'release' }}-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
